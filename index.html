<!DOCTYPE html>
<html lang="en">
<head>
    <title>Scrabble Game</title>
    <meta charset="utf-8">
    <link href="css/style.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.14.1/themes/smoothness/jquery-ui.css">
</head>

<body>
    <h1 style="text-align: center;">Scrabble Game</h1>
    <br>

    <div class="container" id="game-area">
        <!--tile rack to hold 7 draggable tiles-->
        <h5 class="text-center">Your Tile Rack</h5>
        <!--bootstrap utility classes for styling-->
        <div id="rack"></div>

        <h5 class="text-center mt-4">Board Row</h5>
        <div id="boardRow" class="board-row">
            <div class="board-square" data-index="0" data-bonus="normal"></div>
            <div class="board-square" data-index="1" data-bonus="normal"></div>
            <div class="board-square" data-index="2" data-bonus="normal"></div>
            <div class="board-square" data-index="3" data-bonus="double-word"></div>
            <div class="board-square" data-index="4" data-bonus="normal"></div>
            <div class="board-square" data-index="5" data-bonus="normal"></div>
            <div class="board-square" data-index="6" data-bonus="double-letter"></div>
            <div class="board-square" data-index="7" data-bonus="normal"></div>
            <div class="board-square" data-index="8" data-bonus="double-letter"></div>
            <div class="board-square" data-index="9" data-bonus="normal"></div>
            <div class="board-square" data-index="10" data-bonus="normal"></div>
            <div class="board-square" data-index="11" data-bonus="double-word"></div>
            <div class="board-square" data-index="12" data-bonus="normal"></div>
            <div class="board-square" data-index="13" data-bonus="normal"></div>
            <div class="board-square" data-index="14" data-bonus="normal"></div>
        </div>
        <!--show score-->
        <div class="text-center mt-4">
            <button id="calculateScore" class="btn btn-success">Score</button>
            <p id="scoreDisplay" class="mt-3 fs-4"></p>
        </div>
        <!--reset-->
        <div class="text-center mt-2">
            <button id="resetBoard" class="btn btn-danger">Reset Board</button>
        </div>
        <!--new tiles if user gets stuck-->
        <div class="text-center mt-2">
            <button id="dealNewTiles" class="btn btn-primary">Deal New Tiles</button>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
    <script src="js/script.js"></script>

</body>
</html>
